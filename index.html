<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masérská kompenzace</title>
<meta name="description" content="Kompenzační cvičení, pauzy mezi klienty a deník bolesti pro maséry.">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompenzace">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone app; primary actions sit low on the screen within thumb reach; 5-tab bottom bar; 2 columns on tablets. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#17241f; --muted:#556860; --line:#d3ddd8;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcebe6; --warm:#a86a05; --warm-soft:#f6ead2;
  --c1:#0f6b5c; --c2:#b4532a; --c3:#3b5bb5; --danger:#b3261e;
  --fig:#17241f; --fig2:#8fa39a; --prop:#d3ddd8;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714; --surface:#18231f; --ink:#e6efea; --muted:#a3b5ad; --line:#2b3b35;
    --accent:#4fc3ad; --accent-ink:#0b1512; --accent-soft:#1f3731; --warm:#e7ad4a; --warm-soft:#3a2f1a;
    --c1:#4fc3ad; --c2:#e58a63; --c3:#8fa8f0; --danger:#f2867f; --fig:#e6efea; --fig2:#71877e; --prop:#2b3b35; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#18231f; --ink:#e6efea; --muted:#a3b5ad; --line:#2b3b35;
  --accent:#4fc3ad; --accent-ink:#0b1512; --accent-soft:#1f3731; --warm:#e7ad4a; --warm-soft:#3a2f1a;
  --c1:#4fc3ad; --c2:#e58a63; --c3:#8fa8f0; --danger:#f2867f; --fig:#e6efea; --fig2:#71877e; --prop:#2b3b35; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.app{max-width:880px;margin:0 auto;padding:calc(16px + var(--safe-t)) 16px calc(104px + var(--safe-b));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
header.top .who{display:flex;flex-direction:column}
.muted{color:var(--muted)} .small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card.hero .muted{color:inherit;opacity:.88}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.quiet{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.hero .btn{background:var(--accent-ink);color:var(--accent)}
.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.ring{display:flex;gap:6px}
.ring i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.ring i.on{background:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;width:100%;max-width:880px}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;color:var(--muted);font-size:.75rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent;min-height:60px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px 6px;font-weight:600;color:var(--muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rt{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%}
.rt .fig{width:64px;height:64px}
.rt .go{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:0}
.rt .go svg{width:22px;height:22px}
.fig{background:var(--bg);border-radius:12px;color:var(--ink);flex:none}
.fig svg{width:100%;height:100%;display:block}
.ex{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ex .fig{width:80px;height:80px}
details summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:44px;display:flex;align-items:center}
.sliders{display:flex;flex-direction:column;gap:14px}
.sl label{display:flex;justify-content:space-between;font-weight:600}
.sl output{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:600;font-size:.9rem}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:72px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-weight:600;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;border-top:0}
td:first-child{white-space:nowrap}
.scroll{overflow-x:auto}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.heat{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;align-items:center;font-size:.72rem;color:var(--muted)}
.heat .d{aspect-ratio:1;border-radius:6px;background:var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.heat .d.l1{background:var(--accent-soft);color:var(--accent)}
.heat .d.l2{background:var(--accent);color:var(--accent-ink)}
.heat .d.today{outline:2px solid var(--warm);outline-offset:1px}
.heat .d.future{background:transparent;border:1px dashed var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:24px;height:24px;accent-color:var(--accent);margin-top:2px;flex:none}
.note{border-left:4px solid var(--warm);padding:10px 12px;background:var(--surface);border-radius:0 12px 12px 0}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:0}
.hist div>span:last-child{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;overflow:auto;padding:calc(12px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
.overlay .box{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;flex:1}
.player-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.steps{display:flex;gap:4px;flex:1;margin:0 8px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--accent)} .steps i.cur{background:var(--warm)}
.bigfig{width:min(40vw,170px);height:min(40vw,170px);margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;color:var(--ink)}
.bigfig svg{width:100%;height:100%}
.clock{font-family:var(--display);font-size:3rem;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.bar{width:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--warm);width:0}
.controls{margin-top:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0 4px;position:sticky;bottom:0;background:var(--bg)}
.round{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center}
.round svg{width:26px;height:26px}
.controls .btn{min-height:64px;font-size:1.1rem;padding:12px 10px;min-width:0}
@media (max-width:360px){.controls .round{width:56px;height:56px}.tiles{gap:6px}.tile{padding:10px}}
.center{text-align:center}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.dlg .card{width:100%;max-width:460px;margin-bottom:var(--safe-b)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.feel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#report{display:none}
[hidden]{display:none!important}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s linear}.btn,.chip,.tab{transition:background .15s,color .15s}}
@media print{
  @page{size:A4;margin:18mm}
  body{background:#fff;color:#000}
  .app,nav.tabs,.overlay,.toast,.dlg{display:none!important}
  #report{display:block!important;font-family:var(--body);color:#000}
  #report h1{font-size:20pt} #report h2{font-size:13pt;margin-top:14pt}
  #report table{font-size:9.5pt} #report th,#report td{border-top:1px solid #bbb;padding:4pt}
  #report .rp-tiles{display:flex;gap:10pt;margin-top:8pt}
  #report .rp-tiles div{border:1px solid #bbb;border-radius:6pt;padding:6pt 10pt}
  #report .rp-tiles b{font-size:16pt;display:block}
  #report svg{max-width:130mm}
  #report .foot{margin-top:16pt;font-size:8.5pt;color:#444;border-top:1px solid #bbb;padding-top:6pt}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="who"><h1 id="hello">Masérská kompenzace</h1><span class="muted small" id="today"></span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Hlavní navigace"><div class="in" id="tabs"></div></nav>
<div class="overlay" id="player" hidden></div>
<div class="overlay" id="onboard" hidden></div>
<div id="report" aria-hidden="true"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ================= O autorce (upravte zde) ================= */
const AUTHOR = {
  name: "Eliška Růžičková",
  faculty: "Fakulta sportovních studií, Masarykova univerzita",
  purpose: "Aplikace vznikla jako součást seminární práce o kompenzačním cvičení pro maséry (2026).",
  email: "eruzickaa@seznam.cz"
};
const VERSION = "2.4";

/* ================= Cviky a sestavy ================= */
const EX = {
  flex:{n:"Protažení ohybačů předloktí",how:"Předpažte s nataženým loktem, dlaň otočte od sebe a prsty vzhůru. Druhou rukou jemně přitáhněte prsty k sobě, až ucítíte tah na vnitřní straně předloktí.",dose:"20–30 s každá ruka",sides:true,d:{k:"arm",bend:-1}},
  ext:{n:"Protažení natahovačů předloktí",how:"Předpažte s nataženým loktem, dlaň dolů. Druhou rukou ohněte zápěstí dolů, prsty směřují k zemi. Tah cítíte na hřbetní straně předloktí.",dose:"20–30 s každá ruka",sides:true,d:{k:"arm",bend:1}},
  thumb:{n:"Protažení palce",how:"Druhou rukou uchopte palec u jeho základny a jemně ho odtáhněte od dlaně. Netlačte do bolesti, tah má být v bříšku palce.",dose:"15–20 s každá ruka",sides:true,d:{k:"hand",thumb:70,arrow:"thumb"}},
  glide:{n:"Klouzání šlach",how:"Střídejte plynule čtyři polohy: natažené prsty, háček (ohnuté jen koncové články), pěst, stříška (ohnuté jen v základních kloubech).",dose:"5–10 pomalých cyklů",d:{k:"hand",curl:.55}},
  band:{n:"Rozevírání prstů proti gumičce",how:"Nasaďte gumičku kolem konečků všech pěti prstů. Rozevřete prsty od sebe, krátce podržte a pomalu vraťte.",dose:"10–15 opakování, 2 série",sides:true,d:{k:"hand",spread:1.6,band:true,thumb:60}},
  pinch:{n:"Posilování špetkového úchopu",how:"Mezi palec a ukazovák (pak prostředník, prsteník, malík) stiskněte molitanový míček nebo kolíček. Podržte 3 s a povolte. Palec držte v ose, nepropadá se.",dose:"8–10 stisků každým prstem",sides:true,d:{k:"hand",thumb:20,curl:.25}},
  wrist:{n:"Posilování zápěstí",how:"Předloktí položte na stůl, ruka přes okraj, v dlani lehká činka nebo láhev s vodou. Pomalu zvedejte a spouštějte zápěstí, nejdřív dlaní dolů, pak dlaní vzhůru.",dose:"10–15 opakování na každou stranu",sides:true,d:{k:"arm",bend:-.5,weight:true}},
  chin:{n:"Zásuvka brady",how:"Stůjte zpříma. Zasuňte bradu vodorovně dozadu, jako byste dělali dvojitou bradu. Temeno táhněte vzhůru, hlavu nezaklánějte.",dose:"10 opakování s výdrží 5 s",d:{k:"fig",p:"chin"}},
  trap:{n:"Protažení horního trapézu",how:"Ukloňte hlavu k rameni, protilehlé rameno tlačte dolů. Rukou na hlavě úklon jen jemně jistěte, netahejte.",dose:"20–30 s každá strana",sides:true,d:{k:"fig",p:"trap"}},
  pec:{n:"Protažení prsních svalů ve dveřích",how:"Opřete předloktí o zárubeň, loket ve výši ramene. Udělejte krok vpřed a otočte hrudník od opřené paže.",dose:"20–30 s každá strana",sides:true,d:{k:"fig",p:"pec"}},
  row:{n:"Přítahy s gumou",how:"Gumu upevněte ve výši hrudníku. Stáhněte lopatky dolů a k sobě, lokty táhněte podél těla dozadu. Ramena nezvedejte k uším.",dose:"10–15 opakování, 2–3 série",d:{k:"fig",p:"row"}},
  rot:{n:"Zevní rotace ramen s gumou",how:"Lokty držte u těla v pravém úhlu, gumu v obou rukou. Vytáčejte předloktí od sebe, lokty zůstávají přitisknuté k bokům.",dose:"10–15 opakování, 2 série",d:{k:"fig",p:"rot"}},
  angel:{n:"Andělíček u zdi",how:"Opřete záda, hlavu a paže o zeď, lokty do tvaru písmene W. Pomalu sunte paže vzhůru a zpět, bedra se neprohýbají.",dose:"10 pomalých opakování",d:{k:"fig",p:"angel"}},
  cat:{n:"Kočka a kráva",how:"Ve vzporu klečmo střídejte vyhrbení celé páteře s výdechem a plynulé prohnutí s nádechem. Pohyb veďte obratel po obratli.",dose:"10 cyklů",d:{k:"fig",p:"cat"}},
  lunge:{n:"Protažení ohybačů kyčle",how:"Klekněte na jedno koleno, druhá noha vpředu. Podsaďte pánev a posuňte ji vpřed, trup zůstává vzpřímený. Tah cítíte vpředu na kyčli zadní nohy.",dose:"20–30 s každá strana",sides:true,d:{k:"fig",p:"lunge"}},
  bird:{n:"Pták a pes",how:"Ve vzporu klečmo zpevněte břicho. Natáhněte současně jednu paži vpřed a opačnou nohu vzad, pánev se nevytáčí. Vydržte 3 s a vystřídejte.",dose:"8–10 opakování na každou stranu",d:{k:"fig",p:"bird"}},
  bridge:{n:"Most",how:"Lehněte si na záda, pokrčte kolena, chodidla na šířku pánve. Stáhněte hýždě a zvedněte pánev do roviny s koleny a rameny. Pomalu vraťte.",dose:"10–15 opakování, 2 série",d:{k:"fig",p:"bridge"}},
  back:{n:"Záklon ve stoje",how:"Postavte se zpříma, dlaně opřete o bedra. Pomalu se zakloňte, kolena zůstávají natažená, a vraťte se zpět. Vhodné po delším předklonu nad stolem.",dose:"5–10 opakování",d:{k:"fig",p:"back"}}
};
const R = {
  ruce:{n:"Ruce, palec a předloktí",cat:"oblast",area:"ruka",icon:"thumb",steps:[["flex",40],["ext",40],["thumb",30],["glide",40],["band",50],["pinch",50],["wrist",60]]},
  ramena:{n:"Ramena a krk",cat:"oblast",area:"ramena",icon:"angel",steps:[["chin",40],["trap",40],["pec",40],["angel",40],["row",50],["rot",50]]},
  bedra:{n:"Bedra a střed těla",cat:"oblast",area:"bedra",icon:"bird",steps:[["cat",40],["lunge",50],["bird",60],["bridge",50],["back",30]]},
  pred:{n:"Rozcvičení před směnou",cat:"den",icon:"angel",steps:[["glide",40],["angel",40],["chin",30],["cat",40],["back",30]]},
  po:{n:"Protažení po směně",cat:"den",icon:"pec",steps:[["flex",40],["ext",40],["thumb",30],["trap",40],["pec",40],["lunge",50]]},
  sila:{n:"Posilování",cat:"den",strength:true,icon:"row",steps:[["band",50],["pinch",50],["wrist",60],["row",60],["rot",60],["bird",60],["bridge",60]]},
  p1:{n:"Pauza 1 minuta",cat:"pauza",icon:"flex",steps:[["flex",20],["ext",20],["chin",20]]},
  p2:{n:"Pauza 2 minuty",cat:"pauza",icon:"chin",steps:[["flex",20],["ext",20],["chin",20],["trap",30],["back",30]]},

const FEM_CONS=new Set(["dagmar","ester","karin","miriam","ingrid","carmen","ruth","edit","judit","nikol","ivet","margit","rachel","isabel","beatrix","doris","agnes","iris","lili","ellen","helen","kim","dolores","mercedes","inez","ines","elizabet","ingeborg","gertrud","sigrid","astrid","yvonne","noemi","abigail","jasmin","kristin"]);
function vocative(n){
  const w=String(n||"").trim(); if(!w) return "";
  const low=w.toLowerCase();
  if(FEM_CONS.has(low)) return w;
  if(/[eěiíyýoóuúů]$/.test(low)) return w;               // Marie, Jiří, Hugo
  if(/a$/.test(low)) return w.slice(0,-1)+"o";              // Jana → Jano, Honza → Honzo
  if(["pavel","karel","havel"].includes(low)) return w.slice(0,-2)+"le";
  if(/něk$/.test(low)) return w.slice(0,-3)+"ňku";          // Zdeněk → Zdeňku
  if(/děk$/.test(low)) return w.slice(0,-3)+"ďku";          // Luděk → Luďku
  if(/těk$/.test(low)) return w.slice(0,-3)+"ťku";
  if(/[^aeiouyáéíóúůý]ek$/.test(low)) return w.slice(0,-2)+"ku"; // Marek → Marku
  if(/el$/.test(low)) return w+"i";                         // Daniel → Danieli
  if(/[^aeiouyáéíóúůý]r$/.test(low)) return w.slice(0,-1)+"ře"; // Petr → Petře
  if(/(k|h|g)$/.test(low)) return w+"u";                    // Dominik → Dominiku, Jindřich → Jindřichu
  if(/[šžčřjcťďňsxz]$/.test(low)) return w+"i";             // Tomáš → Tomáši, Ondřej → Ondřeji
  return w+"e";                                             // Jan → Jane, Michal → Michale
}

function painChart(data){const W=320,H=170,l=26,r=8,t=10,b=24,n=data.length;
  const x=i=>n<2?(l+(W-l-r)/2):l+i*(W-l-r)/(n-1), y=v=>t+(10-v)*(H-t-b)/10;
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj bolesti v čase" style="width:100%;height:auto;max-width:560px">`;
  [0,5,10].forEach(v=>{o+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line,#ccc)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted,#555)">${v}</text>`;});
  REG.forEach(([k,,c,dash])=>{o+=`<polyline fill="none" stroke="var(${c})" stroke-width="2.5" stroke-dasharray="${dash}" stroke-linejoin="round" points="${data.map((e,i)=>x(i)+","+y(e[k])).join(" ")}"/>`;
    const e=data[n-1];o+=`<circle cx="${x(n-1)}" cy="${y(e[k])}" r="4" fill="var(${c})"/>`;});
  o+=`<text x="${x(0)}" y="${H-6}" font-size="11" fill="var(--muted,#555)">${cz(data[0].d)}</text>`;
  if(n>1)o+=`<text x="${x(n-1)}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted,#555)">${cz(data[n-1].d)}</text>`;
  return o+"</svg>";}
const REG=[["ruka","Palec a zápěstí","--c1",""],["ramena","Ramena a krk","--c2","6 4"],["bedra","Bedra","--c3","2 4"]];
function heatmap(){

  for(let w=0;w<4;w++){const ws=addDays(start,w*7);o+=`<span>${cz(ws)}</span>`;
    for(let i=0;i<7;i++){const d=addDays(ws,i),c=cnt[d]||0,fut=d>TODAY();
      o+=`<span class="d ${fut?"future":c>=2?"l2":c===1?"l1":""} ${d===TODAY()?"today":""}" title="${czFull(d)}: ${c}">${parse(d).getDate()}</span>`;}}
  return o+"</div>";}

let toastT;

  t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);}
function ask(title,text,okLabel,danger){return new Promise(res=>{const d=document.createElement("div");d.className="dlg";

/* ================= Zvuk, vibrace, displej ================= */
let AC=null;
function initSound(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
function beep(f=660,ms=180){if(!S.settings.sound)return;try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+ms/1000);o.start();o.stop(AC.currentTime+ms/1000);}catch(e){}}
function buzz(p){if(S.settings.vibrate&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
let wake=null;
async function keepAwake(on){try{if(on&&"wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}else if(!on&&wake){await wake.release();wake=null;}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&P&&!P.done)keepAwake(true);});

/* ================= Přehrávač ================= */
const player=document.getElementById("player"); let P=null,timer=null;
function start(id){initSound();P={id,i:0,left:R[id].steps[0][1],paused:false,last:Date.now(),half:false,feel:null};player.hidden=false;document.body.style.overflow="hidden";keepAwake(true);paintPlayer();clearInterval(timer);timer=setInterval(tick,250);}
function stop(){clearInterval(timer);P=null;player.hidden=true;document.body.style.overflow="";keepAwake(false);render();}
function tick(){if(!P||P.done)return;const now=Date.now();if(!P.paused)P.left-=(now-P.last)/1000;P.last=now;
  const [ex,sec]=R[P.id].steps[P.i];
  if(EX[ex].sides&&!P.half&&P.left<=sec/2){P.half=true;beep(520);buzz(120);const s=document.getElementById("side");if(s){s.textContent="Vyměňte stranu";s.className="pill";}}
  if(P.left<=0){go(1);return;}
  const c=document.getElementById("clock"),b=document.getElementById("pbar");
  if(c)c.textContent=Math.ceil(P.left)+" s"; if(b)b.style.width=(100*(1-P.left/sec))+"%";}
function go(dir){const st=R[P.id].steps;const n=P.i+dir;
  if(n<0)return;
  if(n<st.length){P.i=n;P.left=st[n][1];P.half=false;P.last=Date.now();beep(760);buzz(60);paintPlayer();}
  else finish();}
function finish(){P.done=true;clearInterval(timer);keepAwake(false);beep(880,400);buzz([80,60,80]);
  const now=new Date();const entry={d:iso(now),t:pad(now.getHours())+":"+pad(now.getMinutes()),r:P.id,min:mins(P.id)};S.log.push(entry);save();P.entry=entry;
  const st=streak();
  player.innerHTML=`<div class="box center" style="justify-content:center">
    <h2>Hotovo${callName()?", "+esc(callName()):""}!</h2>
    <p>${R[P.id].n} · ${minTxt(P.id)}</p>
    <div class="tiles"><div class="tile"><b>${todayCount()}</b><span>dnes</span></div><div class="tile"><b>${st}</b><span>${plural(st,"den","dny","dní")} v řadě</span></div><div class="tile"><b>${weekDays()}</b><span>dní tento týden</span></div></div>
    <div class="field"><span class="lbl">Jak se cítíte?</span><div class="feel">${[["b","Úleva"],["s","Beze změny"],["w","Hůř"]].map(([v,n])=>`<button data-feel="${v}" aria-pressed="false">${n}</button>`).join("")}</div></div>
    <div class="stack" style="margin-top:auto"><button class="btn block" data-stop>Hotovo</button><button class="btn ghost block" data-diary>Zapsat bolest do deníku</button></div></div>`;}
function paintPlayer(){const st=R[P.id].steps,[ex,sec]=st[P.i],e=EX[ex],nx=st[P.i+1];
  player.innerHTML=`<div class="box">
  <div class="player-top"><button class="round" style="width:48px;height:48px" data-stop aria-label="Ukončit cvičení">${ICON.close}</button>
    <div class="steps" aria-hidden="true">${st.map((_,i)=>`<i class="${i<P.i?"done":i===P.i?"cur":""}"></i>`).join("")}</div>
    <span class="small muted">${P.i+1}/${st.length}</span></div>
  <div class="bigfig">${ART(ex)}</div>
  <h2 class="center">${e.n}</h2>
  <div class="clock" id="clock">${Math.ceil(P.left)} s</div><div class="bar"><i id="pbar"></i></div>
  <p class="center"><span class="pill warm" id="side">${e.sides?"Začněte jednou stranou":e.dose}</span></p>
  <p>${e.how}</p>
  ${nx?`<p class="small muted">Další: ${EX[nx[0]].n}</p>`:`<p class="small muted">Poslední cvik</p>`}
  <div class="controls">
    <button class="round" data-step="-1" aria-label="Předchozí cvik" ${P.i===0?"disabled style='opacity:.35'":""}>${ICON.prev}</button>
    <button class="btn" data-pause>${P.paused?ICON.play+"Pokračovat":ICON.pause+"Pozastavit"}</button>
    <button class="round" data-step="1" aria-label="${nx?"Další cvik":"Dokončit"}">${ICON.next}</button></div></div>`;}

/* ================= Hlídač pauzy ================= */
let W=null,wt=null;
function paintWatch(){const el=document.getElementById("watch"),row=document.getElementById("watchrow");if(!el)return;
  row.hidden=!W; if(W){const s=Math.max(0,Math.round((W-Date.now())/1000));el.textContent=pad(Math.floor(s/60))+":"+pad(s%60);}}
function watch(m){clearInterval(wt);if(!m){W=null;paintWatch();return;}initSound();W=Date.now()+m*60000;paintWatch();toast(`Hlídač pauzy: ${m} min`);
  wt=setInterval(()=>{if(Date.now()>=W){clearInterval(wt);W=null;beep(880,500);setTimeout(()=>beep(880,500),600);buzz([200,100,200]);if(!P)start("p2");}else paintWatch();},1000);}

/* ================= Export ================= */
function download(name,mime,content){
  const blob=new Blob([content],{type:mime});
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  try{const f=new File([blob],name,{type:mime});
    if(mobile&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return;}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast("Soubor "+name+" se stahuje");}
const ascii=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase();
const fileBase=()=>"maserska-kompenzace"+(firstName()?"-"+ascii(firstName()):"")+"-"+TODAY();
function dayRows(){
  const days=new Set([...S.log.map(l=>l.d),...S.pain.map(p=>p.d)]);
  return [...days].sort().map(d=>{const L=S.log.filter(l=>l.d===d),p=S.pain.find(x=>x.d===d)||{};
    return {d,n:L.length,min:L.reduce((a,l)=>a+(l.min||0),0),names:L.map(l=>R[l.r]?R[l.r].n:l.r).join(", "),ruka:p.ruka,ramena:p.ramena,bedra:p.bedra,note:p.note||""};});}
function exportCSV(){
  const q=v=>{v=v==null?"":String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=["Datum","Počet sestav","Minuty","Sestavy","Bolest palec a zápěstí (0–10)","Bolest ramena a krk (0–10)","Bolest bedra (0–10)","Poznámka"];
  const rows=dayRows().map(r=>[czFull(r.d),r.n,num(r.min),r.names,r.ruka??"",r.ramena??"",r.bedra??"",r.note]);
  const csv="﻿"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n");
  download(fileBase()+".csv","text/csv;charset=utf-8",csv);}
function exportJSON(){download(fileBase()+"-zaloha.json","application/json",JSON.stringify(Object.assign({app:"maserska-kompenzace",exported:new Date().toISOString()},S),null,1));}
function exportPDF(){
  const p=S.profile||{}, rows=dayRows(), pain=S.pain.slice().sort((a,b)=>a.d<b.d?-1:1);
  const first=rows.length?rows[0].d:TODAY(), total=S.log.length, totalMin=S.log.reduce((a,l)=>a+(l.min||0),0);
  const byR={};S.log.forEach(l=>{byR[l.r]=(byR[l.r]||0)+1;});
  const feel={b:0,s:0,w:0};S.log.forEach(l=>{if(l.feel)feel[l.feel]++;});
  document.getElementById("report").innerHTML=`
  <h1>Přehled pokroku – Masérská kompenzace</h1>
  <p>${p.name?esc(p.name)+" · ":""}období ${czFull(first)} – ${czFull(TODAY())} · vytvořeno ${czFull(TODAY())}</p>
  <p>${p.years!=null?"Praxe "+p.years+" "+plural(p.years,"rok","roky","let")+" · ":""}${p.hours!=null?p.hours+" h masáží týdně · ":""}dominantní ruka ${p.hand==="L"?"levá":"pravá"}${p.areas&&p.areas.length?" · zatížené oblasti: "+p.areas.map(a=>AREAS.find(x=>x[0]===a)[1]).join(", "):""}</p>
  <div class="rp-tiles"><div><b>${total}</b>sestav</div><div><b>${num(totalMin)}</b>minut</div><div><b>${daysWith().size}</b>dní cvičení</div><div><b>${streak()}</b>dní v řadě</div></div>
  <h2>Odcvičené sestavy</h2>
  <table><thead><tr><th>Sestava</th><th>Počet</th></tr></thead><tbody>${Object.keys(byR).sort((a,b)=>byR[b]-byR[a]).map(k=>`<tr><td>${R[k]?R[k].n:esc(k)}</td><td>${byR[k]}</td></tr>`).join("")||"<tr><td colspan=2>Zatím žádné cvičení</td></tr>"}</tbody></table>
  ${feel.b+feel.s+feel.w?`<p>Pocit po cvičení: úleva ${feel.b}×, beze změny ${feel.s}×, hůř ${feel.w}×.</p>`:""}
  <h2>Vývoj bolesti (0–10)</h2>
  ${pain.length?painChart(pain.slice(-30)).replace(/var\(--c1\)/g,"#0f6b5c").replace(/var\(--c2\)/g,"#b4532a").replace(/var\(--c3\)/g,"#3b5bb5")+`<p>Plná čára: palec a zápěstí · čárkovaná: ramena a krk · tečkovaná: bedra</p>`:"<p>Bez záznamů v deníku bolesti.</p>"}
  <h2>Záznamy po dnech</h2>
  <table><thead><tr><th>Datum</th><th>Sestavy</th><th>Min</th><th>Palec</th><th>Ramena</th><th>Bedra</th><th>Poznámka</th></tr></thead><tbody>
  ${rows.slice(-60).reverse().map(r=>`<tr><td>${czFull(r.d)}</td><td>${r.n}</td><td>${num(r.min)}</td><td>${r.ruka??"–"}</td><td>${r.ramena??"–"}</td><td>${r.bedra??"–"}</td><td>${esc(r.note)}</td></tr>`).join("")||"<tr><td colspan=7>Žádné záznamy</td></tr>"}</tbody></table>
  <p class="foot">Aplikace Masérská kompenzace · autorka ${esc(AUTHOR.name)}, ${esc(AUTHOR.faculty)}. Aplikace nenahrazuje vyšetření lékařem nebo fyzioterapeutem.</p>`;
  const done=()=>{toast("V tisku zvolte „Uložit jako PDF“");};
  try{window.print();done();}catch(e){toast("Tisk není v tomto prohlížeči dostupný");}}
async function importJSON(file){
  try{const txt=await file.text();const d=JSON.parse(txt);
    if(!d||!Array.isArray(d.log)||!Array.isArray(d.pain))throw new Error("format");
    const ok=await ask("Obnovit ze zálohy?",`Záloha obsahuje ${d.log.length} ${plural(d.log.length,"cvičení","cvičení","cvičení")} a ${d.pain.length} ${plural(d.pain.length,"záznam","záznamy","záznamů")} bolesti. Současná data v telefonu se nahradí.`,"Obnovit");
    if(!ok)return; delete d.app; delete d.exported; S=normalize(d); save(); applyScale(); render(); toast("Data obnovena");
  }catch(e){toast("Soubor nejde načíst. Vyberte zálohu z této aplikace (.json).");}}

/* ================= Úvodní nastavení ================= */
const onboard=document.getElementById("onboard");
function showOnboard(){onboard.hidden=false;document.body.style.overflow="hidden";
  onboard.innerHTML=`<div class="box">
    <div class="stack" style="gap:6px"><span class="pill" style="align-self:flex-start">Vítejte</span><h1>Masérská kompenzace</h1>
    <p class="muted">Krátká cvičení mezi klienty, deník bolesti a tipy k ergonomii. Řekněte nám o sobě pár věcí a aplikace vám připraví plán.</p></div>
    ${profileForm({},"ob")}
    <p class="small muted">Údaje zůstávají jen v tomto telefonu. Nikam se neodesílají.</p>
    <div class="stack" style="margin-top:auto"><button class="btn block" data-saveprofile="ob">Začít</button>
    <button class="btn ghost block" data-import>Mám zálohu – obnovit</button></div>
    <p class="small muted center">Autorka: ${esc(AUTHOR.name)} · ${esc(AUTHOR.faculty)}</p></div>`;}

/* ================= Události ================= */
document.addEventListener("click",async ev=>{const t=ev.target.closest("button");if(!t)return;const ds=t.dataset;
  if(ds.go){const same=route()===ds.go;location.hash=ds.go;if(same)render();scrollTo(0,0);
    if(ds.anchor)setTimeout(()=>{const a=document.getElementById(ds.anchor);if(a)a.scrollIntoView({block:"start"});},50);}
  else if(ds.run)start(ds.run);
  else if("stop" in ds)stop();
  else if("diary" in ds){stop();location.hash="pokrok";setTimeout(()=>{const f=document.getElementById("painform");if(f)f.scrollIntoView({block:"start"});},50);}
  else if("pause" in ds){P.paused=!P.paused;P.last=Date.now();t.innerHTML=P.paused?ICON.play+"Pokračovat":ICON.pause+"Pozastavit";}
  else if(ds.step)go(+ds.step);
  else if(ds.feel){document.querySelectorAll("[data-feel]").forEach(b=>b.setAttribute("aria-pressed",b===t));if(P&&P.entry){P.entry.feel=ds.feel;save();}}
  else if(ds.watch!==undefined)watch(+ds.watch);
  else if(ds.filter){exFilter=ds.filter;render();}
  else if(ds.hand){document.querySelectorAll(`[data-hand][data-form="${ds.form}"]`).forEach(b=>b.setAttribute("aria-pressed",b===t));}
  else if(ds.area){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")!=="true");}
  else if(ds.saveprofile){const p=readProfile(ds.saveprofile);if(!p.name){toast("Vyplňte prosím jméno");document.getElementById(ds.saveprofile+"-name").focus();return;}
    const firstTime=!S.profile;S.profile=p;save();
    if(firstTime){onboard.hidden=true;document.body.style.overflow="";try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){} location.hash="dnes";render();}
    else{profEdit=false;render();scrollTo(0,0);toast("Profil uložen");}}
  else if("editprofile" in ds){profEdit=true;render();scrollTo(0,0);setTimeout(()=>{const n=document.getElementById("pf-name");if(n)n.focus();},50);}
  else if("canceledit" in ds){profEdit=false;render();scrollTo(0,0);}
  else if(ds.scale){S.settings.scale=+ds.scale;save();applyScale();render();}
  else if(ds.export){({pdf:exportPDF,csv:exportCSV,json:exportJSON})[ds.export]();}
  else if("import" in ds)document.getElementById("importFile").click();
  else if("wipe" in ds){const ok=await ask("Smazat všechna data?","Smaže se profil, historie cvičení i deník bolesti. Nejde to vrátit. Pokud chcete data zachovat, nejdřív si stáhněte zálohu.","Smazat",true);
    if(ok){S=normalize({});save();applyScale();location.hash="dnes";showOnboard();}}
});
document.getElementById("importFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f){if(!onboard.hidden){onboard.hidden=true;document.body.style.overflow="";}importJSON(f).then(()=>{if(!S.profile)showOnboard();});}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.check!==undefined){const d=TODAY(),i=+t.dataset.check;let a=S.check[d]||[];a=t.checked?[...new Set([...a,i])]:a.filter(x=>x!==i);S.check[d]=a;
    Object.keys(S.check).forEach(k=>{if(k<addDays(d,-30))delete S.check[k];});save();render();}
  if(t.dataset.set){S.settings[t.dataset.set]=t.checked;save();}});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.dataset.namefor){const c=document.getElementById(t.dataset.namefor+"-call");if(c&&!c.dataset.touched)c.value=vocative(t.value.trim().split(/\s+/)[0]||"");}
  if(t.id&&/-call$/.test(t.id))t.dataset.touched="1";
  const m=t.id&&t.id.match(/^s-(.+)$/);if(m)document.getElementById("o-"+m[1]).textContent=ev.target.value;});
document.addEventListener("submit",ev=>{ev.preventDefault();if(ev.target.id!=="painform")return;
  const e={d:TODAY(),note:document.getElementById("note").value.trim()};REG.forEach(([k])=>e[k]=+document.getElementById("s-"+k).value);
  S.pain=S.pain.filter(x=>x.d!==TODAY());S.pain.push(e);save();render();toast("Záznam uložen");});
document.addEventListener("keydown",e=>{if(!P||player.hidden)return;if(e.key==="Escape")stop();else if(e.key===" "&&!P.done){e.preventDefault();const b=player.querySelector("[data-pause]");if(b)b.click();}});

/* ================= Start ================= */
applyScale();setDate();render();
if(!S.profile)showOnboard();
setInterval(setDate,60000);
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
