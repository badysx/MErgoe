<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masérská kompenzace</title>
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompenzace">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone app, bottom tab bar, cards on a cool green-grey ground; widens to a 2-column grid on tablets. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#17241f; --muted:#586a62; --line:#d3ddd8;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcebe6; --warm:#b87508;
  --c1:#0f6b5c; --c2:#b4532a; --c3:#3b5bb5;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714; --surface:#18231f; --ink:#e6efea; --muted:#9db0a8; --line:#2b3b35;
    --accent:#4fc3ad; --accent-ink:#0b1512; --accent-soft:#1f3731; --warm:#e7ad4a;
    --c1:#4fc3ad; --c2:#e58a63; --c3:#8fa8f0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#18231f; --ink:#e6efea; --muted:#9db0a8; --line:#2b3b35;
  --accent:#4fc3ad; --accent-ink:#0b1512; --accent-soft:#1f3731; --warm:#e7ad4a;
  --c1:#4fc3ad; --c2:#e58a63; --c3:#8fa8f0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.app{max-width:860px;margin:0 auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:.875rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card.hero .muted{color:inherit;opacity:.85}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.hero .btn{background:var(--accent-ink);color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.warm{background:transparent;border:1px solid var(--warm);color:var(--warm)}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dot.on{background:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:860px}
.tab{flex:1;background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.ex{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.fig{width:96px;height:96px;background:var(--bg);border-radius:10px;color:var(--ink)}
.fig svg{width:100%;height:100%;display:block}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.sliders{display:flex;flex-direction:column;gap:14px}
.sl label{display:flex;justify-content:space-between;font-weight:600}
.sl output{font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:64px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:600;border-top:0}
td:first-child{white-space:nowrap}
.scroll{overflow-x:auto}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:14px;overflow:auto}
.overlay .box{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.bigfig{width:200px;height:200px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink)}
.bigfig svg{width:100%;height:100%}
.clock{font-family:var(--display);font-size:3.2rem;font-variant-numeric:tabular-nums;line-height:1}
.bar{width:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--warm);width:0}
.note{border-left:4px solid var(--warm);padding:8px 12px;background:var(--surface);border-radius:0 10px 10px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s linear}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Masérská kompenzace</h1>
    <span class="muted small" id="today"></span>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Hlavní navigace"><div class="in" id="tabs"></div></nav>
<div class="overlay" id="player" hidden></div>

<script>
/* ---------- data ---------- */
const EX = {
  flex:{n:"Protažení ohybačů předloktí",how:"Předpažte s nataženým loktem, dlaň vzhůru. Druhou rukou jemně stáhněte prsty dolů a k sobě, až ucítíte tah na vnitřní straně předloktí.",dose:"20–30 s každá ruka",sides:true,d:{k:"arm",bend:-1}},
  ext:{n:"Protažení natahovačů předloktí",how:"Předpažte s nataženým loktem, dlaň dolů. Druhou rukou ohněte zápěstí dolů, prsty směřují k zemi. Tah cítíte na hřbetní straně předloktí.",dose:"20–30 s každá ruka",sides:true,d:{k:"arm",bend:1}},
  thumb:{n:"Protažení palce",how:"Druhou rukou uchopte palec u jeho základny a jemně ho odtáhněte od dlaně. Netlačte do bolesti, tah má být v bříšku palce.",dose:"15–20 s každá ruka",sides:true,d:{k:"hand",thumb:70,arrow:"thumb"}},
  glide:{n:"Klouzání šlach",how:"Střídejte plynule čtyři polohy: natažené prsty, háček (ohnuté jen koncové články), pěst, stříška (ohnuté jen v základních kloubech).",dose:"5–10 pomalých cyklů",d:{k:"hand",curl:.55}},
  band:{n:"Rozevírání prstů proti gumičce",how:"Nasaďte gumičku kolem konečků všech pěti prstů. Rozevřete prsty od sebe, krátce podržte a pomalu vraťte.",dose:"10–15 opakování, 2 série",sides:true,d:{k:"hand",spread:1.6,band:true,thumb:60}},
  wrist:{n:"Posilování zápěstí",how:"Předloktí položte na stůl, ruka přes okraj, v dlani lehká činka nebo láhev s vodou. Pomalu zvedejte a spouštějte zápěstí, nejdřív dlaní dolů, pak dlaní vzhůru.",dose:"10–15 opakování na každou stranu",sides:true,d:{k:"arm",bend:-.5,weight:true}},
  chin:{n:"Zásuvka brady",how:"Stůjte zpříma. Zasuňte bradu vodorovně dozadu, jako byste dělali dvojitou bradu. Temeno táhněte vzhůru, hlavu nezaklánějte.",dose:"10 opakování s výdrží 5 s",d:{k:"fig",p:"chin"}},
  trap:{n:"Protažení horního trapézu",how:"Ukloňte hlavu k rameni, protilehlé rameno tlačte dolů. Rukou na hlavě úklon jen jemně jistěte, netahejte.",dose:"20–30 s každá strana",sides:true,d:{k:"fig",p:"trap"}},
  pec:{n:"Protažení prsních svalů ve dveřích",how:"Opřete předloktí o zárubeň, loket ve výši ramene. Udělejte krok vpřed a otočte hrudník od opřené paže.",dose:"20–30 s každá strana",sides:true,d:{k:"fig",p:"pec"}},
  row:{n:"Přítahy s gumou",how:"Gumu upevněte ve výši hrudníku. Stáhněte lopatky dolů a k sobě, lokty táhněte podél těla dozadu. Ramena nezvedejte k uším.",dose:"10–15 opakování, 2–3 série",d:{k:"fig",p:"row"}},
  rot:{n:"Zevní rotace ramen s gumou",how:"Lokty držte u těla v pravém úhlu, gumu v obou rukou. Vytáčejte předloktí od sebe, lokty zůstávají přitisknuté k bokům.",dose:"10–15 opakování, 2 série",d:{k:"fig",p:"rot"}},
  angel:{n:"Andělíček u zdi",how:"Opřete záda, hlavu a paže o zeď, lokty do tvaru písmene W. Pomalu sunte paže vzhůru a zpět, bedra se neprohýbají.",dose:"10 pomalých opakování",d:{k:"fig",p:"angel"}},
  cat:{n:"Kočka a kráva",how:"Ve vzporu klečmo střídejte vyhrbení celé páteře s výdechem a plynulé prohnutí s nádechem. Pohyb veďte obratel po obratli.",dose:"10 cyklů",d:{k:"fig",p:"cat"}},
  lunge:{n:"Protažení ohybačů kyčle",how:"Klekněte na jedno koleno, druhá noha vpředu. Podsaďte pánev a posuňte ji vpřed, trup zůstává vzpřímený. Tah cítíte vpředu na kyčli zadní nohy.",dose:"20–30 s každá strana",sides:true,d:{k:"fig",p:"lunge"}},
  bird:{n:"Pták a pes",how:"Ve vzporu klečmo zpevněte břicho. Natáhněte současně jednu paži vpřed a opačnou nohu vzad, pánev se nevytáčí. Vydržte 3 s a vystřídejte.",dose:"8–10 opakování na každou stranu",d:{k:"fig",p:"bird"}},
  bridge:{n:"Most",how:"Lehněte si na záda, pokrčte kolena, chodidla na šířku pánve. Stáhněte hýždě a zvedněte pánev do roviny s koleny a rameny. Pomalu vraťte.",dose:"10–15 opakování, 2 série",d:{k:"fig",p:"bridge"}},
  back:{n:"Záklon ve stoje",how:"Postavte se zpříma, dlaně opřete o bedra. Pomalu se zakloňte, kolena zůstávají natažená, a vraťte se zpět. Vhodné po delším předklonu nad stolem.",dose:"5–10 opakování",d:{k:"fig",p:"back"}}
};
const R = {
  ruce:{n:"Ruce, palec a předloktí",t:"sestava",steps:[["flex",40],["ext",40],["thumb",30],["glide",40],["band",50],["wrist",60]]},
  ramena:{n:"Ramena a krk",t:"sestava",steps:[["chin",40],["trap",40],["pec",40],["angel",40],["row",50],["rot",50]]},
  bedra:{n:"Bedra a střed těla",t:"sestava",steps:[["cat",40],["lunge",50],["bird",60],["bridge",50],["back",30]]},
  pred:{n:"Rozcvičení před směnou",t:"den",steps:[["glide",40],["angel",40],["chin",30],["cat",40],["back",30]]},
  po:{n:"Protažení po směně",t:"den",steps:[["flex",40],["ext",40],["thumb",30],["trap",40],["pec",40],["lunge",50]]},
  sila:{n:"Posilování",t:"den",steps:[["band",50],["wrist",60],["row",60],["rot",60],["bird",60],["bridge",60]]},
  p1:{n:"Pauza 1 minuta",t:"pauza",steps:[["flex",20],["ext",20],["chin",20]]},
  p2:{n:"Pauza 2 minuty",t:"pauza",steps:[["flex",20],["ext",20],["chin",20],["trap",30],["back",30]]},
  p3:{n:"Pauza 3 minuty",t:"pauza",steps:[["flex",20],["ext",20],["thumb",30],["chin",20],["trap",30],["pec",30],["back",30]]}
};
const TIPS = [
  {h:"Výška stolu",src:"Jang et al., 2006",items:["Nastavte stůl tak, abyste při hlazení měli lokty mírně pokrčené a ramena volně dole. Jako výchozí bod poslouží výška kloubů prstů při volně spuštěné paži.","Nevhodná výška stolu zvyšuje riziko bolestí beder. Před každým klientem ji zkontrolujte, hlavně při střídání technik."]},
  {h:"Postoj a práce tělem",src:"Albert et al., 2008",items:["Sílu berte z nohou a z přenosu váhy těla, ne z ramen a paží. Pracujte ve výpadu, čelem ke směru tahu.","Hlavu držte v prodloužení páteře. Dlouhé předklánění krku souvisí s bolestmi zad."]},
  {h:"Šetřete palec",src:"Snodgrass et al., 2003",items:["Tlak palcem nahrazujte loktem, předloktím, pěstí nebo pomůckou, kdykoli to technika dovolí.","Když už palec použijete, podepřete ho ostatními prsty a držte klouby v ose, bez prolomení do záklonu.","Zápěstí držte v prodloužení předloktí, ne ohnuté do stran."]},
  {h:"Rozvrh dne",src:"Jang et al., 2006; Blau et al., 2013",items:["Více než 4 hodiny přímé práce s klienty denně zvyšují riziko potíží prstů. Plánujte s tím.","Mezi klienty si nechte pár minut na pauzu a krátké cvičení.","Střídejte techniky a typy masáží, ať nezatěžujete stále stejné struktury."]}
];
const TABS = [["dnes","Dnes","M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],["sestavy","Sestavy","M4 6h16M4 12h16M4 18h10"],["pauza","Pauza","M12 7v5l3 2M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z"],["denik","Deník","M4 19V5M4 19h16M7 15l4-5 3 3 5-7"],["ergonomie","Ergonomie","M12 4a2 2 0 1 0 0 4a2 2 0 0 0 0-4zM6 10h12M12 10v5l-3 5M12 15l3 5"]];

/* ---------- storage ---------- */
const KEY="kcm-v1"; let S={log:[],pain:[]};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const cz=s=>{const [y,m,d]=s.split("-");return (+d)+". "+(+m)+".";};
const TODAY=iso(new Date());
function weekStart(){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=r=>Math.round(R[r].steps.reduce((a,s)=>a+s[1],0)/60*2)/2;
const minTxt=r=>{const m=mins(r);return String(m).replace(".",",")+" min";};

/* ---------- drawings ---------- */
const POSE={
  chin:{h:[58,22],n:[58,33],p:[58,68],a1:[[56,50],[55,66]],a2:[[60,50],[61,66]],l1:[[55,88],[54,108]],l2:[[61,88],[62,108]],ar:[[82,22],[68,22]]},
  trap:{h:[69,24],n:[60,34],p:[60,68],a1:[[50,50],[48,66]],a2:[[80,24],[72,14]],l1:[[56,88],[54,108]],l2:[[64,88],[66,108]],ar:[[84,36],[84,22]]},
  pec:{h:[56,22],n:[56,33],p:[54,68],a1:[[72,34],[76,16]],a2:[[52,50],[50,66]],l1:[[46,88],[38,108]],l2:[[62,86],[66,108]],wall:78,ar:[[40,46],[28,46]]},
  row:{h:[52,22],n:[52,33],p:[52,68],a1:[[40,48],[58,44]],a2:[[42,50],[60,46]],l1:[[48,88],[46,108]],l2:[[56,88],[58,108]],band:[[60,45],[110,45]],ar:[[92,34],[74,34]]},
  rot:{h:[60,22],n:[60,33],p:[60,68],a1:[[50,52],[34,52]],a2:[[70,52],[86,52]],l1:[[56,88],[54,108]],l2:[[64,88],[66,108]],band:[[34,52],[86,52]],ar:[[88,40],[100,40]]},
  angel:{h:[60,22],n:[60,33],p:[60,68],a1:[[42,40],[38,20]],a2:[[78,40],[82,20]],l1:[[56,88],[54,108]],l2:[[64,88],[66,108]],ar:[[98,36],[98,16]]},
  cat:{h:[26,82],n:[38,72],p:[82,72],sp:[60,50],a1:[[37,90],[36,108]],a2:[[39,90],[40,108]],l1:[[84,108],[106,108]],l2:[[86,108],[108,108]],ar:[[60,40],[60,28]]},
  bird:{h:[27,64],n:[38,72],p:[82,72],a1:[[24,70],[8,68]],a2:[[39,90],[40,108]],l1:[[100,72],[116,70]],l2:[[84,108],[106,108]]},
  bridge:{h:[14,100],n:[25,100],p:[60,78],a1:[[40,104],[56,106]],a2:[[40,104],[56,106]],l1:[[84,76],[88,108]],l2:[[86,78],[90,108]],ar:[[60,66],[60,52]]},
  lunge:{h:[60,18],n:[60,29],p:[60,66],a1:[[68,48],[62,62]],a2:[[66,48],[60,62]],l1:[[84,70],[84,108]],l2:[[44,106],[20,106]],ar:[[70,80],[82,84]]},
  back:{h:[48,24],n:[53,34],p:[62,68],a1:[[66,50],[61,62]],a2:[[66,50],[61,62]],l1:[[60,88],[58,108]],l2:[[64,88],[64,108]],ar:[[40,34],[30,40]]}
};
const L=(a,b,c="")=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${c}/>`;
function arrow(a,b){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),s=6;
  const p=k=>[b[0]-s*Math.cos(ang+k),b[1]-s*Math.sin(ang+k)];
  return `<g stroke="var(--warm)" stroke-width="3">${L(a,b)}${L(p(.5),b)}${L(p(-.5),b)}</g>`;}
function draw(d){
  let o=`<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`;
  if(d.k==="fig"){const q=POSE[d.p];
    o+=L([6,112],[114,112],'stroke-width="2" opacity=".35"');
    if(q.wall) o+=L([q.wall,8],[q.wall,112],'stroke-width="5" opacity=".35"');
    if(q.band) o+=L(q.band[0],q.band[1],'stroke="var(--accent)" stroke-width="3" stroke-dasharray="5 4"');
    o+=`<circle cx="${q.h[0]}" cy="${q.h[1]}" r="8"/>`;
    o+=q.sp?`<path d="M${q.n} Q${q.sp} ${q.p}"/>`:L(q.n,q.p);
    for(const a of [q.a1,q.a2]) o+=`<polyline points="${q.n} ${a[0]} ${a[1]}"/>`;
    for(const l of [q.l1,q.l2]) o+=`<polyline points="${q.p} ${l[0]} ${l[1]}"/>`;
    if(q.ar) o+=arrow(q.ar[0],q.ar[1]);
  } else if(d.k==="arm"){const w=[72,60],hand=[72+24*Math.cos(d.bend*1.0),60+26*Math.sin(d.bend*1.0)];
    o+=L([14,60],w,'stroke-width="12"')+L(w,hand,'stroke-width="10"');
    if(d.weight){o+=`<rect x="${hand[0]-5}" y="${hand[1]-12}" width="10" height="24" rx="3" fill="var(--accent)" stroke="none"/>`+arrow([104,74],[104,46]);}
    else o+=arrow([hand[0]+14,60],[hand[0]+14,60+20*Math.sign(d.bend)]);
  } else {const sp=d.spread||1,c=d.curl||0,len=34*(1-c);
    o+=`<rect x="40" y="62" width="40" height="42" rx="10" stroke-width="4"/>`;
    const tips=[];[-1.5,-.5,.5,1.5].forEach((i,k)=>{const a=(-90+i*9*sp)*Math.PI/180,b=[45+k*10,62],l=len*(k===0||k===3?.85:1),t=[b[0]+l*Math.cos(a),b[1]+l*Math.sin(a)];tips.push(t);o+=L(b,t,'stroke-width="7"');});
    const ta=(180+(d.thumb||35))*Math.PI/180,tb=[41,90],tt=[tb[0]+26*Math.cos(ta-Math.PI/2),tb[1]+26*Math.sin(ta-Math.PI/2)];
    o+=L(tb,tt,'stroke-width="8"');
    if(d.band){const xs=tips.map(t=>t[0]).concat(tt[0]),ys=tips.map(t=>t[1]).concat(tt[1]);const x0=Math.min(...xs)-5,x1=Math.max(...xs)+5,y0=Math.min(...ys)-4,y1=Math.max(...ys)+4;
      o+=`<ellipse cx="${(x0+x1)/2}" cy="${(y0+y1)/2}" rx="${(x1-x0)/2}" ry="${(y1-y0)/2}" stroke="var(--accent)" stroke-width="3" stroke-dasharray="5 4"/>`;}
    if(d.arrow==="thumb") o+=arrow([tt[0]+2,tt[1]-12],[tt[0]-10,tt[1]-20]);
    if(c) o+=arrow([98,40],[98,62]);
  }
  return o+"</svg>";
}

/* ---------- views ---------- */
const view=document.getElementById("view");
function countToday(){return S.log.filter(l=>l.d===TODAY).length;}
function silaWeek(){const ws=weekStart();return new Set(S.log.filter(l=>l.r==="sila"&&l.d>=ws).map(l=>l.d)).size;}
function routineCard(id,extra=""){const r=R[id];
  return `<div class="card"><div class="row spread"><h3>${r.n}</h3><span class="pill">${minTxt(id)}</span></div>
  <p class="muted small">${r.steps.map(s=>EX[s[0]].n).join(" · ")}</p>${extra}
  <div class="row"><button class="btn" data-run="${id}">Spustit</button></div></div>`;}
function vDnes(){
  const h=new Date().getHours(); const rec=h<10?"pred":h<17?"p2":"po";
  const why=h<10?"Ráno před prvním klientem":"".concat(h<17?"Během směny, mezi klienty":"Po poslední masáži");
  const sw=silaWeek();
  return `<div class="grid">
  <div class="card hero"><span class="small muted">${why}</span><h2>${R[rec].n}</h2>
    <p class="muted small">${minTxt(rec)} · ${R[rec].steps.length} cviků</p>
    <div class="row"><button class="btn" data-run="${rec}">Začít cvičit</button></div></div>
  <div class="card"><h3>Dnes odcvičeno</h3><p><span class="clock">${countToday()}</span> <span class="muted">${countToday()===1?"sestava":countToday()>=2&&countToday()<=4?"sestavy":"sestav"}</span></p>
    <p class="muted small">Počítá se každá dokončená sestava i krátká pauza.</p></div>
  <div class="card"><div class="row spread"><h3>Posilování tento týden</h3><span class="pill">${sw} ze 3</span></div>
    <div class="dots" aria-hidden="true">${[0,1,2].map(i=>`<span class="dot ${i<sw?"on":""}"></span>`).join("")}</div>
    <p class="muted small">Silový trénink třikrát týdně má nejlepší doložený účinek na prevenci potíží horních končetin.</p>
    <div class="row"><button class="btn ghost" data-run="sila">Spustit posilování (${minTxt("sila")})</button></div></div>
  </div>
  <h2 style="margin-top:22px">Rozvrh dne</h2>
  <div class="grid" style="margin-top:12px">${routineCard("pred")}${routineCard("p2")}${routineCard("po")}</div>
  <p class="note small" style="margin-top:18px">Aplikace je studijní prototyp k seminární práci a nenahrazuje vyšetření. Při ostré, noční nebo přetrvávající bolesti, brnění či otoku cvičení přerušte a poraďte se s lékařem nebo fyzioterapeutem.</p>`;}
function vSestavy(){
  return ["ruce","ramena","bedra"].map(id=>`<div class="card" style="margin-bottom:12px">
    <div class="row spread"><h2>${R[id].n}</h2><span class="pill">${minTxt(id)}</span></div>
    <div class="row"><button class="btn" data-run="${id}">Spustit sestavu</button></div>
    <details><summary>Zobrazit ${R[id].steps.length} cviků</summary>
    ${R[id].steps.map(s=>{const e=EX[s[0]];return `<div class="ex"><div class="fig">${draw(e.d)}</div><div><h3>${e.n}</h3><p class="small">${e.how}</p><p class="small"><span class="pill warm">${e.dose}</span></p></div></div>`;}).join("")}
    </details></div>`).join("");}
function vPauza(){
  return `<p class="muted" style="margin-bottom:12px">Krátké cvičení, které stihnete při výměně prostěradla. Vyberte podle času do dalšího klienta.</p>
  <div class="grid">${["p1","p2","p3"].map(id=>routineCard(id)).join("")}</div>
  <div class="card" style="margin-top:12px"><h3>Hlídač pauzy</h3>
    <p class="muted small">Spusťte na začátku masáže. Po uplynutí času zazní tón a nabídne se cvičení. Nechte aplikaci otevřenou.</p>
    <div class="row">${[30,50,60,90].map(m=>`<button class="btn ghost" data-watch="${m}">${m} min</button>`).join("")}</div>
    <p id="watch" class="clock" style="font-size:2rem" hidden></p>
    <div class="row" id="watchstop" hidden><button class="btn ghost" data-watch="0">Zrušit</button></div></div>`;}
const REG=[["ruka","Palec a zápěstí","--c1",""],["ramena","Ramena a krk","--c2","6 4"],["bedra","Bedra","--c3","2 4"]];
function sample(){const out=[];const base=[[5,4,3],[5,5,3],[4,4,4],[4,3,3],[3,3,2],[3,2,2],[2,2,2]];
  base.forEach((b,i)=>{const d=new Date();d.setDate(d.getDate()-(7-i));out.push({d:iso(d),ruka:b[0],ramena:b[1],bedra:b[2],note:""});});return out;}
function chart(data){const W=320,H=170,l=26,r=8,t=10,b=24,n=data.length;
  const x=i=>n<2?(l+(W-l-r)/2):l+i*(W-l-r)/(n-1), y=v=>t+(10-v)*(H-t-b)/10;
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj bolesti v čase" style="width:100%;height:auto;max-width:560px">`;
  [0,5,10].forEach(v=>{o+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;});
  REG.forEach(([k,,c,dash])=>{o+=`<polyline fill="none" stroke="var(${c})" stroke-width="2.5" stroke-dasharray="${dash}" stroke-linejoin="round" points="${data.map((e,i)=>x(i)+","+y(e[k])).join(" ")}"/>`;
    const e=data[n-1];o+=`<circle cx="${x(n-1)}" cy="${y(e[k])}" r="4" fill="var(${c})"/>`;});
  o+=`<text x="${x(0)}" y="${H-6}" font-size="11" fill="var(--muted)">${cz(data[0].d)}</text>`;
  if(n>1)o+=`<text x="${x(n-1)}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${cz(data[n-1].d)}</text>`;
  return o+"</svg>";}
function vDenik(){
  const real=S.pain.slice().sort((a,b)=>a.d<b.d?-1:1), isSample=!real.length, data=(isSample?sample():real).slice(-14);
  const cur=real.find(e=>e.d===TODAY)||{ruka:0,ramena:0,bedra:0,note:""};
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
  <form class="card" id="painform"><h2>Dnešní záznam</h2><p class="muted small">0 = bez bolesti, 10 = nejhorší představitelná bolest.</p>
    <div class="sliders">${REG.map(([k,n])=>`<div class="sl"><label for="s-${k}">${n}<output id="o-${k}">${cur[k]}</output></label><input type="range" id="s-${k}" min="0" max="10" step="1" value="${cur[k]}"></div>`).join("")}</div>
    <label for="note" class="small" style="font-weight:600">Poznámka (počet masáží, co bolest spustilo)</label>
    <textarea id="note">${esc(cur.note||"")}</textarea>
    <div class="row"><button class="btn" type="submit">Uložit záznam</button><span class="muted small" id="saved"></span></div></form>
  <div class="card"><div class="row spread"><h2>Vývoj bolesti</h2>${isSample?'<span class="pill warm">Ukázková data</span>':""}</div>
    ${chart(data)}
    <div class="legend">${REG.map(([,n,c,dash])=>`<span><i style="border-color:var(${c});border-top-style:${dash?"dashed":"solid"}"></i>${n}</span>`).join("")}</div>
    <p class="muted small">${isSample?"Po uložení prvního záznamu se zde zobrazí vaše hodnoty.":"Posledních "+data.length+" záznamů. Data zůstávají jen v tomto zařízení."}</p>
    ${isSample?"":`<div class="scroll"><table><thead><tr><th>Datum</th><th>Palec</th><th>Ramena</th><th>Bedra</th><th>Poznámka</th></tr></thead><tbody>${data.slice().reverse().map(e=>`<tr><td>${cz(e.d)}</td><td>${e.ruka}</td><td>${e.ramena}</td><td>${e.bedra}</td><td>${esc(e.note||"")}</td></tr>`).join("")}</tbody></table></div>`}
  </div></div>`;}
function vErgo(){
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${TIPS.map(t=>`<div class="card"><h2>${t.h}</h2><ul class="tips">${t.items.map(i=>`<li>${i}</li>`).join("")}</ul><p class="muted small">Zdroj: ${t.src}</p></div>`).join("")}</div>`;}
const VIEWS={dnes:vDnes,sestavy:vSestavy,pauza:vPauza,denik:vDenik,ergonomie:vErgo};
function route(){const k=location.hash.slice(1);return VIEWS[k]?k:"dnes";}
function render(){const k=route();view.innerHTML=VIEWS[k]();
  document.querySelectorAll(".tab").forEach(t=>t.toggleAttribute("aria-current",false));
  const cur=document.querySelector(`.tab[data-go="${k}"]`); if(cur) cur.setAttribute("aria-current","page");
  if(k==="pauza") paintWatch();}
document.getElementById("tabs").innerHTML=TABS.map(([k,n,p])=>`<button class="tab" data-go="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p}"/></svg>${n}</button>`).join("");
document.getElementById("today").textContent=new Date().toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long"});
addEventListener("hashchange",render);

/* ---------- sound ---------- */
let AC=null;
function initSound(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
function beep(f=660,ms=180){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+ms/1000);o.start();o.stop(AC.currentTime+ms/1000);}catch(e){}}

/* ---------- player ---------- */
const player=document.getElementById("player"); let P=null,timer=null;
function start(id){initSound();P={id,i:0,left:R[id].steps[0][1],paused:false,last:Date.now(),half:false};player.hidden=false;paintPlayer();clearInterval(timer);timer=setInterval(tick,250);}
function stop(){clearInterval(timer);P=null;player.hidden=true;render();}
function tick(){if(!P||P.done)return;const now=Date.now();if(!P.paused)P.left-=(now-P.last)/1000;P.last=now;
  const [ex,sec]=R[P.id].steps[P.i];
  if(EX[ex].sides&&!P.half&&P.left<=sec/2){P.half=true;beep(520);const s=document.getElementById("side");if(s)s.textContent="Vyměňte stranu";}
  if(P.left<=0){next();return;}
  const c=document.getElementById("clock"),b=document.getElementById("pbar");
  if(c)c.textContent=Math.ceil(P.left)+" s"; if(b)b.style.width=(100*(1-P.left/sec))+"%";}
function next(){const st=R[P.id].steps;if(P.i<st.length-1){P.i++;P.left=st[P.i][1];P.half=false;P.last=Date.now();beep(760);paintPlayer();}
  else{P.done=true;clearInterval(timer);beep(880,400);S.log.push({d:TODAY,r:P.id});save();
    player.innerHTML=`<div class="box" style="margin-top:12vh"><h2>Hotovo</h2><p>${R[P.id].n} je zapsaná do dnešního přehledu.</p><div class="row" style="justify-content:center"><button class="btn" data-stop>Zpět do aplikace</button><button class="btn ghost" data-diary>Zapsat bolest</button></div></div>`;}}
function paintPlayer(){const st=R[P.id].steps,[ex,sec]=st[P.i],e=EX[ex];
  player.innerHTML=`<div class="box"><div class="row spread" style="width:100%"><span class="muted small">${R[P.id].n} · cvik ${P.i+1} z ${st.length}</span><button class="btn ghost" data-stop style="padding:6px 14px;min-height:36px">Ukončit</button></div>
  <div class="bigfig">${draw(e.d)}</div><h2>${e.n}</h2>
  <div class="clock" id="clock" aria-live="off">${Math.ceil(P.left)} s</div><div class="bar"><i id="pbar"></i></div>
  <p class="pill warm" id="side">${e.sides?"Začněte jednou stranou":e.dose}</p>
  <p>${e.how}</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" data-pause>${P.paused?"Pokračovat":"Pozastavit"}</button><button class="btn" data-next>${P.i<st.length-1?"Další cvik":"Dokončit"}</button></div></div>`;}

/* ---------- break watcher ---------- */
let W=null,wt=null;
function paintWatch(){const el=document.getElementById("watch"),st=document.getElementById("watchstop");if(!el)return;
  el.hidden=st.hidden=!W; if(W){const s=Math.max(0,Math.round((W-Date.now())/1000));el.textContent=pad(Math.floor(s/60))+":"+pad(s%60);}}
function watch(m){clearInterval(wt);if(!m){W=null;paintWatch();return;}initSound();W=Date.now()+m*60000;paintWatch();
  wt=setInterval(()=>{if(Date.now()>=W){clearInterval(wt);W=null;beep(880,500);setTimeout(()=>beep(880,500),600);if(!P)start("p2");}else paintWatch();},1000);}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.go){location.hash=t.dataset.go;if(route()===t.dataset.go)render();scrollTo(0,0);}
  else if(t.dataset.run)start(t.dataset.run);
  else if("stop" in t.dataset)stop();
  else if("diary" in t.dataset){stop();location.hash="denik";render();}
  else if("pause" in t.dataset){P.paused=!P.paused;P.last=Date.now();t.textContent=P.paused?"Pokračovat":"Pozastavit";}
  else if("next" in t.dataset)next();
  else if(t.dataset.watch!==undefined)watch(+t.dataset.watch);});
document.addEventListener("input",ev=>{const m=ev.target.id&&ev.target.id.match(/^s-(.+)$/);if(m)document.getElementById("o-"+m[1]).textContent=ev.target.value;});
document.addEventListener("submit",ev=>{ev.preventDefault();if(ev.target.id!=="painform")return;
  const e={d:TODAY,note:document.getElementById("note").value.trim()};REG.forEach(([k])=>e[k]=+document.getElementById("s-"+k).value);
  S.pain=S.pain.filter(x=>x.d!==TODAY);S.pain.push(e);save();render();const s=document.getElementById("saved");if(s)s.textContent="Uloženo";});
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
